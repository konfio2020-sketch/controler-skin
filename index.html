<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>k0nfio • PS4 Controller Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
#wrap{width:900px;height:520px;position:relative;margin:auto}
.name{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:36px;font-weight:900;letter-spacing:6px;color:#fff;text-shadow:0 2px 10px #000,0 0 18px rgba(80,150,255,.45)}
.controller{position:absolute;left:45px;top:72px;width:810px;height:350px}
.shell{position:absolute;inset:0;background:linear-gradient(145deg,#20242b,#101318);border:2px solid rgba(255,255,255,.16);border-radius:170px 170px 125px 125px;box-shadow:0 20px 45px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.grip{position:absolute;top:190px;width:175px;height:205px;background:linear-gradient(160deg,#171a20,#090b0e);border:2px solid rgba(255,255,255,.12);border-radius:75px 75px 105px 105px;z-index:-1}
.leftGrip{left:48px;transform:rotate(13deg)}.rightGrip{right:48px;transform:rotate(-13deg)}
.face{position:absolute;left:150px;right:150px;top:25px;bottom:35px;background:linear-gradient(145deg,#080a0e,#151920);border-radius:125px 125px 95px 95px;border:1px solid rgba(255,255,255,.09)}
.touchpad{position:absolute;left:50%;top:24px;transform:translateX(-50%);width:190px;height:76px;border-radius:15px;background:linear-gradient(145deg,#2b3038,#11151b);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 2px 5px rgba(0,0,0,.5)}
.touchpad:after{content:"";position:absolute;left:22px;right:22px;top:5px;height:2px;background:rgba(110,180,255,.22);box-shadow:0 0 10px rgba(110,180,255,.25)}
.ps{position:absolute;left:50%;top:112px;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:#171b21;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;color:#dfe6ee;font-size:12px;font-weight:bold}
.dpad{position:absolute;left:57px;top:145px;width:108px;height:108px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.45))}
.d{position:absolute;background:#15191f;border:1px solid rgba(255,255,255,.11);border-radius:6px}
.du,.dd{width:34px;height:108px;left:37px}.dl,.dr{width:108px;height:34px;top:37px}.du{top:0}.dd{bottom:0}.dl{left:0}.dr{right:0}
.stick{position:absolute;width:154px;height:154px;border-radius:50%;background:radial-gradient(circle,rgba(110,170,255,.09) 0 34%,rgba(255,255,255,.035) 35% 57%,transparent 58%);border:3px solid rgba(180,205,235,.52);box-shadow:0 0 0 8px rgba(255,255,255,.025),0 0 24px rgba(70,145,255,.18);z-index:3}
#ls{left:185px;top:151px}#rs{right:185px;top:151px}
.cap{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px;border-radius:50%;background:radial-gradient(circle at 32% 27%,#69727d,#303740 52%,#12161b 100%);border:2px solid rgba(255,255,255,.42);box-shadow:0 8px 14px rgba(0,0,0,.55),inset 0 2px 3px rgba(255,255,255,.12)}
.cap:after{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(255,255,255,.08)}
.buttons{position:absolute;right:53px;top:142px;width:128px;height:128px;z-index:3}
.btn{position:absolute;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;background:linear-gradient(145deg,#20252c,#0d1015);border:1px solid rgba(255,255,255,.2);box-shadow:0 5px 9px rgba(0,0,0,.4);text-shadow:0 1px 4px #000}
#tri{left:44px;top:0;color:#6fdb9b}#sq{left:0;top:44px;color:#ef77c9}#circ{right:0;top:44px;color:#e86d78}#cross{left:44px;bottom:0;color:#78aef2}
.share,.options{position:absolute;top:124px;width:45px;height:7px;border-radius:8px;background:#2a2f36;border:1px solid rgba(255,255,255,.1)}.share{left:260px}.options{right:260px}
.speaker{position:absolute;left:50%;top:154px;transform:translateX(-50%);width:55px;height:8px;border-radius:8px;background:repeating-linear-gradient(90deg,#30353d 0 3px,transparent 3px 7px);opacity:.7}
#status{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,255,255,.48);font-size:10px;letter-spacing:2px}
</style></head><body><div id="wrap">
<div class="name">k0nfio</div>
<div class="controller"><div class="grip leftGrip"></div><div class="grip rightGrip"></div><div class="shell"></div><div class="face"></div>
<div class="touchpad"></div><div class="ps">PS</div><div class="speaker"></div><div class="share"></div><div class="options"></div>
<div class="dpad"><i class="d du"></i><i class="d dd"></i><i class="d dl"></i><i class="d dr"></i></div>
<div class="stick" id="ls"><div class="cap"></div></div><div class="stick" id="rs"><div class="cap"></div></div>
<div class="buttons"><div class="btn" id="tri">△</div><div class="btn" id="sq">□</div><div class="btn" id="circ">○</div><div class="btn" id="cross">×</div></div>
</div><div id="status">CONNECT CONTROLLER</div></div>
<script>
const clamp=v=>Math.max(-1,Math.min(1,v));
function move(id,x,y){const el=document.getElementById(id),cap=el.querySelector('.cap'),max=39,dead=.07;let xx=x||0,yy=y||0;if(Math.abs(xx)<dead)xx=0;else xx=(Math.abs(xx)-dead)/(1-dead)*Math.sign(xx);if(Math.abs(yy)<dead)yy=0;else yy=(Math.abs(yy)-dead)/(1-dead)*Math.sign(yy);cap.style.transform='translate('+clamp(xx)*max+'px,'+clamp(yy)*max+'px)'}
function loop(){const pads=navigator.getGamepads?navigator.getGamepads():[],p=[...pads].find(x=>x);if(p){move('ls',p.axes[0],p.axes[1]);move('rs',p.axes[2],p.axes[3]);document.getElementById('status').textContent='CONNECTED • DUALSHOCK 4'}else document.getElementById('status').textContent='CONNECT CONTROLLER';requestAnimationFrame(loop)}loop();
</script></body></html>
