<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controller Overlay</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,sans-serif}#wrap{width:900px;height:520px;position:relative;margin:auto}.controller{position:absolute;left:70px;top:70px;width:760px;height:370px;background:rgba(10,12,20,.72);border:4px solid rgba(255,255,255,.18);border-radius:190px 190px 150px 150px;box-shadow:0 0 35px rgba(0,220,255,.18),inset 0 0 45px rgba(255,255,255,.04)}.grip{position:absolute;width:190px;height:245px;background:rgba(8,10,17,.78);border:4px solid rgba(255,255,255,.12);bottom:-70px;border-radius:80px}.leftGrip{left:55px;transform:rotate(12deg)}.rightGrip{right:55px;transform:rotate(-12deg)}.stick{position:absolute;width:145px;height:145px;border-radius:50%;background:radial-gradient(circle,rgba(0,255,255,.18) 0 35%,rgba(0,255,255,.06) 36% 62%,transparent 63%);border:3px solid rgba(0,230,255,.65);box-shadow:0 0 22px rgba(0,230,255,.35)}#ls{left:170px;top:120px}#rs{right:170px;top:120px}.cap{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#79efff 30%,#0b7b9a 70%,#052e3b);border:3px solid #b8faff;box-shadow:0 0 24px rgba(0,240,255,.85)}#buttons{position:absolute;right:78px;top:118px;width:125px;height:125px}.btn{position:absolute;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:bold;font-size:14px;background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.35)}#bY{left:43px}#bX{left:0;top:43px}#bB{right:0;top:43px}#bA{left:43px;bottom:0}.dpad{position:absolute;left:90px;top:145px;width:100px;height:100px}.d{position:absolute;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.25);border-radius:8px}.du,.dd{width:34px;height:100px;left:33px}.dl,.dr{width:100px;height:34px;top:33px}.du{top:0}.dd{bottom:0}.dl{left:0}.dr{right:0}.label{position:absolute;top:25px;left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:20px;font-weight:bold;letter-spacing:3px;text-shadow:0 0 10px #00eaff}#status{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:14px}</style></head><body><div id="wrap"><div class="label">CONTROLLER</div><div class="controller"><div class="grip leftGrip"></div><div class="grip rightGrip"></div><div class="dpad"><i class="d du"></i><i class="d dd"></i><i class="d dl"></i><i class="d dr"></i></div><div class="stick" id="ls"><div class="cap"></div></div><div class="stick" id="rs"><div class="cap"></div></div><div id="buttons"><div class="btn" id="bY">Y</div><div class="btn" id="bX">X</div><div class="btn" id="bB">B</div><div class="btn" id="bA">A</div></div></div><div id="status">Connect controller • Browser Source: 900 × 520</div></div><script>const clamp=v=>Math.max(-1,Math.min(1,v));function move(id,x,y){const el=document.getElementById(id),cap=el.querySelector('.cap'),max=34,dead=.08;let xx=Math.abs(x)<dead?0:x,yy=Math.abs(y)<dead?0:y;if(Math.abs(xx)>0)xx=(Math.abs(xx)-dead)/(1-dead)*Math.sign(xx);if(Math.abs(yy)>0)yy=(Math.abs(yy)-dead)/(1-dead)*Math.sign(yy);cap.style.transform='translate('+clamp(xx)*max+'px,'+clamp(yy)*max+'px)';el.style.boxShadow='0 0 '+(22+Math.abs(xx)*18+Math.abs(yy)*18)+'px rgba(0,230,255,.55)'}function loop(){const pads=navigator.getGamepads?navigator.getGamepads():[],p=[...pads].find(x=>x);if(p){move('ls',p.axes[0]||0,p.axes[1]||0);move('rs',p.axes[2]||0,p.axes[3]||0);document.getElementById('status').textContent=p.id}else document.getElementById('status').textContent='Connect controller • Browser Source: 900 × 520';requestAnimationFrame(loop)}loop();</script></body></html>
