<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>k0nfio • PlayStation Controller</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,sans-serif}
#wrap{width:900px;height:520px;position:relative;margin:auto}
.name{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:34px;font-weight:800;letter-spacing:7px;color:#fff;text-shadow:0 0 18px rgba(0,180,255,.55)}
.sub{position:absolute;top:55px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:4px;color:rgba(255,255,255,.45)}
.controller{position:absolute;left:75px;top:88px;width:750px;height:335px;background:rgba(18,20,28,.88);border:2px solid rgba(255,255,255,.18);border-radius:175px 175px 125px 125px;box-shadow:0 18px 50px rgba(0,0,0,.35),0 0 35px rgba(0,170,255,.12)}
.grip{position:absolute;width:175px;height:225px;background:rgba(16,18,25,.92);border:2px solid rgba(255,255,255,.12);bottom:-55px;border-radius:70px}
.leftGrip{left:48px;transform:rotate(10deg)}.rightGrip{right:48px;transform:rotate(-10deg)}
.stick{position:absolute;width:142px;height:142px;border-radius:50%;background:radial-gradient(circle,rgba(0,190,255,.12) 0 34%,rgba(255,255,255,.025) 35% 58%,transparent 59%);border:2px solid rgba(100,210,255,.62);box-shadow:0 0 18px rgba(0,180,255,.28)}
#ls{left:165px;top:112px}#rs{right:165px;top:112px}
.cap{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#f8fbff,#a8b2bd 28%,#4f5964 72%,#272d34);border:2px solid rgba(255,255,255,.55);box-shadow:0 7px 14px rgba(0,0,0,.4)}
.buttons{position:absolute;right:66px;top:110px;width:126px;height:126px}
.btn{position:absolute;width:39px;height:39px;border-radius:50%;display:grid;place-items:center;color:#dfe5ea;font-weight:bold;font-size:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22)}
#bY{left:43px}#bX{left:0;top:43px}#bB{right:0;top:43px}#bA{left:43px;bottom:0}
.dpad{position:absolute;left:82px;top:136px;width:104px;height:104px}.d{position:absolute;background:#252a32;border:1px solid rgba(255,255,255,.1);border-radius:7px}
.du,.dd{width:32px;height:104px;left:36px}.dl,.dr{width:104px;height:32px;top:36px}.du{top:0}.dd{bottom:0}.dl{left:0}.dr{right:0}
.options{position:absolute;left:50%;top:145px;transform:translateX(-50%);display:flex;gap:20px}.touch{width:52px;height:8px;border-radius:10px;background:rgba(255,255,255,.18)} 
#status{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:rgba(255,255,255,.5);font-size:11px;letter-spacing:1px}
</style></head><body><div id="wrap"><div class="name">k0nfio</div><div class="sub">CONTROLLER OVERLAY</div><div class="controller"><div class="grip leftGrip"></div><div class="grip rightGrip"></div><div class="dpad"><i class="d du"></i><i class="d dd"></i><i class="d dl"></i><i class="d dr"></i></div><div class="stick" id="ls"><div class="cap"></div></div><div class="stick" id="rs"><div class="cap"></div></div><div class="buttons"><div class="btn" id="bY">△</div><div class="btn" id="bX">□</div><div class="btn" id="bB">○</div><div class="btn" id="bA">×</div></div><div class="options"><div class="touch"></div><div class="touch"></div></div></div><div id="status">CONNECT CONTROLLER</div></div>
<script>
const clamp=v=>Math.max(-1,Math.min(1,v));
function move(id,x,y){const el=document.getElementById(id),cap=el.querySelector('.cap'),max=34,dead=.08;let xx=Math.abs(x)<dead?0:x,yy=Math.abs(y)<dead?0:y;if(xx)xx=(Math.abs(xx)-dead)/(1-dead)*Math.sign(xx);if(yy)yy=(Math.abs(yy)-dead)/(1-dead)*Math.sign(yy);cap.style.transform='translate('+clamp(xx)*max+'px,'+clamp(yy)*max+'px)'}
function loop(){const pads=navigator.getGamepads?navigator.getGamepads():[],p=[...pads].find(x=>x);if(p){move('ls',p.axes[0]||0,p.axes[1]||0);move('rs',p.axes[2]||0,p.axes[3]||0);document.getElementById('status').textContent='CONNECTED • '+p.id}else document.getElementById('status').textContent='CONNECT CONTROLLER';requestAnimationFrame(loop)}loop();
</script></body></html>
