<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>k0nfio PS4 Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,sans-serif}#wrap{width:900px;height:520px;position:relative;margin:auto}.name{position:absolute;top:8px;width:100%;text-align:center;color:white;font-size:34px;font-weight:900;letter-spacing:7px;text-shadow:0 2px 8px #000}
.pad{position:absolute;left:105px;top:75px;width:690px;height:350px}
.body{position:absolute;left:90px;right:90px;top:0;height:295px;background:linear-gradient(150deg,#30343a,#15181d 55%,#0d0f13);border-radius:155px 155px 105px 105px;box-shadow:0 18px 30px #0008,inset 0 2px 1px #ffffff20;border:1px solid #ffffff22}
.handle{position:absolute;top:170px;width:185px;height:190px;background:linear-gradient(155deg,#20242a,#0b0d10);border:1px solid #ffffff18;z-index:-1}.hl{left:65px;transform:rotate(12deg);border-radius:65px 70px 100px 80px}.hr{right:65px;transform:rotate(-12deg);border-radius:70px 65px 80px 100px}
.inner{position:absolute;left:150px;right:150px;top:24px;height:260px;background:#111419;border-radius:115px 115px 90px 90px;border:1px solid #ffffff0d}
.touch{position:absolute;top:28px;left:50%;transform:translateX(-50%);width:185px;height:72px;border-radius:12px;background:linear-gradient(#30343b,#14171b);border:1px solid #ffffff22;box-shadow:inset 0 2px 5px #000}.touch:before{content:"";position:absolute;left:15px;right:15px;top:6px;height:2px;background:#76b9ff33}
.small{position:absolute;top:125px;width:42px;height:8px;background:#30343a;border-radius:8px}.share{left:225px}.opts{right:225px}
.ps{position:absolute;top:124px;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:#1c2026;border:1px solid #ffffff25;color:#ddd;display:grid;place-items:center;font-size:10px;font-weight:bold}
.dpad{position:absolute;left:55px;top:145px;width:95px;height:95px}.d{position:absolute;background:#20242a;border:1px solid #ffffff12}.v{left:31px;width:33px;height:95px}.h{top:31px;width:95px;height:33px}.up{top:0}.down{bottom:0}.left{left:0}.right{right:0}
.stick{position:absolute;top:145px;width:118px;height:118px;border-radius:50%;background:radial-gradient(circle,#20252c 0 42%,#090b0e 43% 64%,#303640 65% 68%,#111419 69%);border:2px solid #b9c5d244;box-shadow:0 0 0 7px #ffffff08;z-index:4}.ls{left:185px}.rs{right:185px}.cap{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#8a939d,#3d444d 48%,#12161a);border:2px solid #ffffff55;box-shadow:0 7px 12px #0009;transition:transform .03s linear}.cap:after{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid #ffffff15}
.buttons{position:absolute;right:45px;top:140px;width:112px;height:112px}.btn{position:absolute;width:36px;height:36px;border-radius:50%;background:#1c2026;border:1px solid #ffffff2a;display:grid;place-items:center;font-size:16px;font-weight:bold;box-shadow:0 4px 8px #0008}.tri{left:38px;color:#71d59a}.sq{top:38px;color:#e878c5}.cir{right:0;top:38px;color:#ed747d}.cross{left:38px;bottom:0;color:#72aaf2}
.light{position:absolute;left:50%;top:3px;transform:translateX(-50%);width:90px;height:3px;background:#68b8ff;box-shadow:0 0 12px #4aa8ff}
#status{position:absolute;bottom:9px;width:100%;text-align:center;color:#ffffff66;font-size:10px;letter-spacing:2px}
</style></head><body><div id="wrap"><div class="name">k0nfio</div><div class="pad"><div class="handle hl"></div><div class="handle hr"></div><div class="body"></div><div class="inner"></div><div class="light"></div><div class="touch"></div><div class="small share"></div><div class="small opts"></div><div class="ps">PS</div>
<div class="dpad"><i class="d v up"></i><i class="d v down"></i><i class="d h left"></i><i class="d h right"></i></div>
<div class="stick ls" id="ls"><div class="cap"></div></div><div class="stick rs" id="rs"><div class="cap"></div></div>
<div class="buttons"><div class="btn tri">△</div><div class="btn sq">□</div><div class="btn cir">○</div><div class="btn cross">×</div></div></div><div id="status">CONNECT CONTROLLER</div></div>
<script>
const c=v=>Math.max(-1,Math.min(1,v));function move(id,x,y){const e=document.querySelector('#'+id+' .cap'),d=.07,m=34;let a=x||0,b=y||0;a=Math.abs(a)<d?0:(Math.abs(a)-d)/(1-d)*Math.sign(a);b=Math.abs(b)<d?0:(Math.abs(b)-d)/(1-d)*Math.sign(b);e.style.transform='translate('+c(a)*m+'px,'+c(b)*m+'px)'}function loop(){const p=[...(navigator.getGamepads?navigator.getGamepads():[])].find(Boolean);if(p){move('ls',p.axes[0],p.axes[1]);move('rs',p.axes[2],p.axes[3]);status.textContent='CONNECTED • DUALSHOCK 4'}else status.textContent='CONNECT CONTROLLER';requestAnimationFrame(loop)}loop();
</script></body></html>
